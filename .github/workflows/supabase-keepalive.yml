# Keeps the Supabase free-tier project alive by pinging it daily.
#
# Supabase pauses projects after 7 days of inactivity. A daily ping via the
# service role key ensures a real DB query executes and resets the timer.
# The anon key is intentionally NOT used — it may return empty results due to
# RLS without touching the database, which Supabase might not count as activity.
#
# Required GitHub secrets:
#   SUPABASE_URL              — e.g. https://xxxxxxxxxxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — Project Settings → API → service_role (secret)

name: Supabase keep-alive

on:
  schedule:
    # Every 4 days at 08:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: '0 8 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profile?limit=1")

          echo "Status: $STATUS"

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Ping failed — project may be paused or misconfigured."
            exit 1
          fi

          echo "Project is alive."
