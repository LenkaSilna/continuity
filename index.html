<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Osobní tracker pleti a doplňků" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Continuity" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Continuity</title>
    <!-- Apply theme + accent from localStorage before React mounts to prevent FOUC.
         Mirrors lib/appearance.ts (kept in sync manually — this runs before any
         module loads, so it can't import from there). -->
    <script>
      (function () {
        var locale = localStorage.getItem("locale") || "cs";
        document.documentElement.setAttribute("lang", locale);
        var t = localStorage.getItem("app_theme") || "light";
        var a = localStorage.getItem("app_accent") || "lavender";
        var dataThemes = { rose: "pink", lavender: "lila", mint: "mint" };
        var el = document.documentElement;
        if (t === "dark") el.classList.add("dark");
        el.setAttribute("data-mode", t === "dark" ? "dark" : "light");
        el.setAttribute("data-theme", dataThemes[a] || "lila");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
